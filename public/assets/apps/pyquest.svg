<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="pq-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Tile with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="6"/>

  <!-- Python Dual-Node Logic Emblem (Scaled and Centered) -->
  <g transform="translate(80, 80) scale(11)" filter="url(#pq-shadow)">
    <!-- Top loop (Cyan Head) -->
    <path
      d="M16 4C11.5 4 8 7 8 11V13H16V15H6C3.5 15 2 17 2 20C2 23 4 25 7 25H9V22C9 19.5 11 18 14 18H20C22.5 18 24 16.5 24 14V11C24 7 20.5 4 16 4Z"
      fill="#38bdf8"
    />
    <!-- Cyan Eye Node -->
    <circle cx="12" cy="8.5" r="1.5" fill="#020617"/>
    <circle cx="12" cy="8.5" r="0.6" fill="#bae6fd"/>

    <!-- Bottom loop (Purple/Indigo Body) -->
    <path
      d="M16 28C20.5 28 24 25 24 21V19H16V17H26C28.5 17 30 15 30 12C30 9 28 7 25 7H23V10C23 12.5 21 14 18 14H12C9.5 14 8 15.5 8 18V21C8 25 11.5 28 16 28Z"
      fill="#818cf8"
    />
    <!-- Purple Eye Node -->
    <circle cx="20" cy="23.5" r="1.5" fill="#020617"/>
    <circle cx="20" cy="23.5" r="0.6" fill="#c7d2fe"/>
  </g>
</svg>
